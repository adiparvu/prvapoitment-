# PRV Beauty — local Supabase stack.
#
# `supabase start` reads this file. Everything here describes the *local*
# development stack; hosted projects are configured in the dashboard, and the
# only values that must match across both are the ones the app depends on:
# the exposed schemas, the auth redirect URLs, and each function's JWT policy.

project_id = "prv-beauty"

# -----------------------------------------------------------------------------
# API (PostgREST)
# -----------------------------------------------------------------------------

[api]
enabled = true
port = 54321
# `public` only. Nothing in `auth` or `storage` is reachable over PostgREST, so
# a client can never read `auth.users` directly.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# A generous page size for the salon calendar without allowing an unbounded
# table scan from a device.
max_rows = 1000

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------

[db]
port = 54322
shadow_port = 54320
# 15+ is required: `security_invoker` views (0003) and `btree_gist` exclusion
# constraints on uuid (0001) both depend on it.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
schema_paths = []

# -----------------------------------------------------------------------------
# Realtime — powers `ChatRepository.liveMessages(conversationID:)`
# -----------------------------------------------------------------------------

[realtime]
enabled = true

# -----------------------------------------------------------------------------
# Studio & mail
# -----------------------------------------------------------------------------

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

# -----------------------------------------------------------------------------
# Storage
#
# Two buckets with opposite postures: salon media is marketing collateral and
# is public; client documents are consent forms and treatment photos and are
# never public — they are served through short-lived signed URLs only.
# -----------------------------------------------------------------------------

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.salon-media]
public = true
file_size_limit = "50MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/heic", "video/mp4"]
objects_path = "./seed/salon-media"

[storage.buckets.client-documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf", "image/png", "image/jpeg", "image/heic"]

# -----------------------------------------------------------------------------
# Auth
# -----------------------------------------------------------------------------

[auth]
enabled = true
# The app's universal-link callback.
site_url = "prvbeauty://auth-callback"
additional_redirect_urls = [
  "prvbeauty://auth-callback",
  "https://app.prvbeauty.com/auth/callback",
  "http://localhost:3000",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only — hosted environments require confirmation.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Sign in with Apple is the primary path (see docs/SECURITY.md §1).
[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
redirect_uri = ""

# -----------------------------------------------------------------------------
# Edge Functions
#
# `verify_jwt` is the outer gate. Every function except the Stripe webhook
# requires a Supabase session before its code runs; each then re-authorizes the
# specific action against `profiles` and the RLS policies.
#
# `stripe-webhook` is the deliberate exception: Stripe has no Supabase session,
# so its authentication is the request signature, verified in the handler
# before any field of the payload is read.
# -----------------------------------------------------------------------------

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.create-payment-intent]
verify_jwt = true

[functions.confirm-booking]
verify_jwt = true

[functions.cancel-appointment]
verify_jwt = true

[functions.assistant-recommend]
verify_jwt = true

[functions.notify-fanout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# -----------------------------------------------------------------------------
# Analytics — off locally; hosted projects use the dashboard's own pipeline.
# -----------------------------------------------------------------------------

[analytics]
enabled = false
