# PRV Beauty — XcodeGen manifest.
# Run `xcodegen generate` to produce PRVBeauty.xcodeproj.
name: PRVBeauty
options:
  bundleIdPrefix: com.prv.beauty
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  PRVBeauty:
    path: .

targets:
  PRVBeautyApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Shared
      - path: App/Resources
    dependencies:
      - package: PRVBeauty
        products:
          - PRVFoundation
          - PRVModels
          - PRVDesignSystem
          - PRVNetworking
          - PRVPersistence
          - PRVBookingKit
          - PRVPaymentsKit
          - PRVLoyaltyKit
          - PRVAuthFeature
          - PRVHomeFeature
          - PRVDiscoverFeature
          - PRVSalonProfileFeature
          - PRVBookingFeature
          - PRVPaymentsFeature
          - PRVWalletFeature
          - PRVMembershipsFeature
          - PRVChatFeature
          - PRVNotificationsFeature
          - PRVDashboardFeature
          - PRVCRMFeature
          - PRVOperationsFeature
      - target: PRVBeautyWidgets
        embed: true
    info:
      path: App/Sources/Info.plist
      properties:
        CFBundleDisplayName: PRV Beauty
        CFBundleLocalizations: [en, nl, fr]
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.prv.beauty.refresh]
        NSFaceIDUsageDescription: Unlock PRV Beauty and confirm bookings with Face ID.
        NSLocationWhenInUseUsageDescription: Find the best salons and professionals near you.
        NSCameraUsageDescription: Capture looks, before & after photos, and chat media.
        NSPhotoLibraryUsageDescription: Share inspiration photos with your professional.
        NSMicrophoneUsageDescription: Record voice messages in chat.
        NSCalendarsFullAccessUsageDescription: Sync appointments with your calendar.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.prv.beauty.deeplink
            CFBundleURLSchemes: [prvbeauty]
    entitlements:
      path: App/Sources/PRVBeauty.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.in-app-payments: [merchant.com.prv.beauty]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.prv.beauty]
        aps-environment: production
        com.apple.developer.authentication-services.autofill-credential-provider: false
        com.apple.security.application-groups: [group.com.prv.beauty]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prv.beauty.app
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PRVBeautyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
    dependencies:
      - package: PRVBeauty
        products: [PRVFoundation, PRVModels, PRVDesignSystem]
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: PRV Beauty Widgets
        CFBundleLocalizations: [en, nl, fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/Widgets/PRVBeautyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.prv.beauty]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prv.beauty.app.widgets

  PRVBeautyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PRVBeautyUITests
    dependencies:
      - target: PRVBeautyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prv.beauty.app.uitests
        TEST_TARGET_NAME: PRVBeautyApp

schemes:
  PRVBeauty:
    build:
      targets:
        PRVBeautyApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PRVBeauty/PRVModelsTests
        - package: PRVBeauty/PRVBookingKitTests
        - package: PRVBeauty/PRVPaymentsKitTests
        - package: PRVBeauty/PRVLoyaltyKitTests
        - package: PRVBeauty/PRVNetworkingTests
        - package: PRVBeauty/PRVPersistenceTests
        - PRVBeautyUITests
    archive:
      config: Release
